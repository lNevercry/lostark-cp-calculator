proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=bible_cache:10m max_size=1g inactive=60m use_temp_path=off;
# ==============================================================================
# Hardened Nginx Configuration - lostark-cp
# ==============================================================================

# Rate limiting zones (keyed by client IP)
# 1. bible_limit: Protects lostark.bible upstream and prevents scraper abuse (5 req/sec, burst 10)
# 2. general_limit: Protects static assets and SPA against volumetric floods (25 req/sec, burst 50)
limit_req_zone $remote_addr zone=bible_limit:10m rate=5r/s;
limit_req_zone $remote_addr zone=general_limit:10m rate=25r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lostark.nevercry-prox.com localhost _;

    # 1. Information Disclosure Hardening: Hide Nginx version
    server_tokens off;

    # 2. Real IP Restoration: Trust LAN reverse proxy & Cloudflare forwarders
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # 3. Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 4. HTTP Security Headers (Applied to all standard requests)
    # Même politique que _headers (Cloudflare Pages) : aucun script inline (images de repli par data-fallback, js/core.js)
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.loseii.com/loa-astrogem-calc/model/astrogem.js https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lostark.bible https://cdn.discordapp.com https://character-cdn.ags.lol https://*.ags.lol https://*.game.onstove.com https://*.lostark.co.kr; connect-src 'self' https://lostark.bible https://www.loseii.com https://cloudflareinsights.com http://127.0.0.1:4848 http://localhost:4848 ws://127.0.0.1:4848 ws://localhost:4848; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $csp always;

    # Rate limiting on all general traffic
    limit_req zone=general_limit burst=50 nodelay;

    # 5. Strict Reverse Proxy for lostark.bible Character API
    # Allows ONLY legitimate character data JSON requests; blocks any other proxy endpoint
    location ^~ /api/bible/character/ {
        limit_except GET HEAD {
            deny all;
        }

        # Un seul format de chemin : région connue, un pseudo, __data.json ($uri décodé : un %2F ajoute un segment)
        if ($uri !~ "^/api/bible/character/(CE|NA|NAE|NAW|SA)/[^/]+/__data\.json$") {
            return 404;
        }

        # Upstream rate limit
        limit_req zone=bible_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass https://lostark.bible/character/;
        proxy_cache bible_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 15m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_set_header Host lostark.bible;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        # Repeat security headers (Nginx gotcha: location-level add_header clears parent headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # 5b. Market prices (EUC) from the loa-buddy market API — fixed request, not an open proxy
    # The browser cannot call the API directly (no Access-Control-Allow-Origin for our domain)
    location = /api/market/prices {
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=bible_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_method POST;
        proxy_set_header Content-Type "application/json";
        proxy_set_body '{"region_slug":"euc","item_slugs":["destiny-leapstone","prime-oreha-fusion-material","abidos-fusion-material","destiny-destruction-stone","destiny-guardian-stone","lavas-breath","glaciers-breath","grudge","cursed-doll","hit-master","super-charge","mass-increase","barricade","all-out-attack","stabilized-status","master-brawler","ambush-master","raid-captain","keen-blunt-weapon","precise-dagger","adrenaline","ether-predator","contender","superior-abidos-fusion-material","destiny-crystallized-destruction-stone","destiny-crystallized-guardian-stone","great-destiny-leapstone","abidos-wild-flower","shy-wild-flower","wild-flower","abidos-timber","tender-timber","timber","abidos-iron-ore","heavy-iron-ore","iron-ore","abidos-thick-raw-meat","treated-meat","thick-raw-meat","abidos-solar-carp","redflesh-fish","fish","abidos-relic","rare-relic","ancient-relic"]}';
        proxy_pass https://marketdata-api.yrzhao1068589.workers.dev/v1/prices/latest;
        proxy_cache bible_cache;
        # Requête fixe : une seule entrée de cache, la query string ne la contourne pas
        proxy_cache_key "market-prices";
        proxy_cache_valid 200 15m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_set_header Host marketdata-api.yrzhao1068589.workers.dev;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # 6. Anti-Abuse: Explicitly forbid any other path under /api/bible/
    location /api/bible/ {
        return 403;
    }

    # 7. Silence Favicon & Robots log spam
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # 8. Caching & Security Headers for Scripts, Stylesheets & Dynamic Data
    location ~* \.(html|css|js|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # 9. Caching & Security Headers for Static Media / Assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 10. Downloads (.exe, .zip)
    location ~* \.(zip|exe)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # 10. SPA Frontend Fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
